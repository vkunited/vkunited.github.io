<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Memories — Host Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap');
        :root { --primary-color:#6B7A64; --secondary-color:#D4AF37; --bg-color:#FAF9F6; --text-color:#333; --light-bg:#fff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Montserrat',sans-serif; background:var(--bg-color); color:var(--text-color); line-height:1.6; }
        h1,h2 { font-family:'Playfair Display',serif; font-weight:400; }
        header { text-align:center; padding:30px 20px; background:var(--light-bg); box-shadow:0 2px 5px rgba(0,0,0,0.05); }
        header h1 { color:var(--primary-color); font-size:1.8rem; }
        header p { color:#999; font-size:0.85rem; letter-spacing:1px; }
        main { max-width:1000px; margin:0 auto; padding:30px 18px 80px; }
        .gate { max-width:360px; margin:60px auto; background:#fff; padding:34px 28px; border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,0.06); text-align:center; }
        .gate input { width:100%; padding:12px 14px; border:1px solid #e2ddd0; border-radius:6px; margin-top:16px; font-size:1rem; }
        .btn { cursor:pointer; font-family:'Montserrat',sans-serif; font-size:0.85rem; letter-spacing:1px; text-transform:uppercase;
               background:var(--primary-color); color:#fff; border:none; padding:12px 22px; border-radius:30px; transition:background .25s; }
        .btn:hover { background:#5c6a56; }
        .btn.gold { background:var(--secondary-color); color:#3a3320; }
        .btn.gold:hover { background:#c8a532; }
        .btn.danger { background:#b0524a; }
        .btn:disabled { opacity:.5; cursor:default; }
        .toolbar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:22px; }
        .toolbar .left { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
        .stat { background:#efece2; color:#8a8167; padding:6px 14px; border-radius:20px; font-size:0.8rem; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
        .item { position:relative; background:#fff; border-radius:6px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .item .media { aspect-ratio:1; background:#eee; cursor:pointer; }
        .item .media img, .item .media video { width:100%; height:100%; object-fit:cover; display:block; }
        .item .meta { padding:8px 10px; font-size:0.75rem; }
        .item .meta .nm { color:var(--primary-color); font-weight:500; }
        .item .meta .cap { color:#777; max-height:2.4em; overflow:hidden; }
        .item .meta .ts { color:#bbb; font-size:0.68rem; margin-top:2px; }
        .item .del { position:absolute; top:6px; right:6px; background:rgba(176,82,74,0.92); color:#fff; border:none;
                     width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:1rem; line-height:1; }
        .item .vbadge { position:absolute; top:6px; left:6px; background:rgba(0,0,0,0.6); color:#fff; font-size:0.65rem; padding:2px 7px; border-radius:4px; }
        .empty { text-align:center; color:#aaa; padding:60px 10px; }
        .hint { color:#999; font-size:0.8rem; margin-top:10px; }
        a.dl { color:var(--primary-color); text-decoration:none; font-size:0.75rem; }
    </style>
</head>
<body>
    <header>
        <h1>Vi Vien &amp; Khanh</h1>
        <p>MEMORIES · HOST ADMIN</p>
    </header>

    <main>
        <!-- Password gate -->
        <div class="gate" id="gate">
            <h2>Host access</h2>
            <p class="hint">Enter the admin password to manage uploads.</p>
            <input type="password" id="pwd" placeholder="Admin password" onkeydown="if(event.key==='Enter')unlock()">
            <button class="btn" style="margin-top:16px;width:100%" onclick="unlock()">Unlock</button>
            <p class="hint" id="gateErr" style="color:#b0524a;display:none">Wrong password.</p>
        </div>

        <!-- Dashboard -->
        <div id="dash" style="display:none">
            <div class="toolbar">
                <div class="left">
                    <span class="stat" id="statCount">0 items</span>
                    <button class="btn" onclick="load()">↻ Refresh</button>
                </div>
                <div class="left">
                    <button class="btn gold" onclick="downloadAll()">⬇ Download all (links)</button>
                </div>
            </div>
            <div class="grid" id="grid"></div>
            <div class="empty" id="empty" style="display:none">No uploads yet.</div>
        </div>
    </main>

<script>
const API_BASE = "https://vk-memories.vkunited26.workers.dev";
let TOKEN = "";
let ITEMS = [];

// Host-facing challenge labels (English). Keep IDs in sync with the Worker.
const CHAL = {
    couple:  { e: '💑', l: 'With the bride & groom', p: 30 },
    dancer:  { e: '💃', l: 'The best dancer',         p: 20 },
    funny:   { e: '😂', l: 'The funniest moment',     p: 20 },
    toast:   { e: '🥂', l: 'A toast / cheers',        p: 15 },
    dressed: { e: '👗', l: 'Best-dressed guest',      p: 15 },
    family:  { e: '👪', l: 'A family group photo',    p: 15 },
    food:    { e: '🍽️', l: 'The food',               p: 10 },
    detail:  { e: '💐', l: 'A lovely detail / decor', p: 10 },
};

function unlock() {
    TOKEN = document.getElementById('pwd').value;
    load(true);
}

async function load(fromGate) {
    try {
        const res = await fetch(`${API_BASE}/api/admin/list`, { headers: { 'X-Admin-Token': TOKEN } });
        if (res.status === 401) { document.getElementById('gateErr').style.display = 'block'; return; }
        if (!res.ok) throw new Error(res.status);
        ITEMS = await res.json();
        if (fromGate) {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('dash').style.display = 'block';
            try { sessionStorage.setItem('vk_admin', TOKEN); } catch(e){}
        }
        render();
    } catch (e) { alert('Failed to load: ' + e.message); }
}

function render() {
    const grid = document.getElementById('grid');
    const totalLikes = ITEMS.reduce((s, it) => s + (it.likes || 0), 0);
    document.getElementById('statCount').textContent = ITEMS.length + ' items · ' + totalLikes + ' ❤';
    document.getElementById('empty').style.display = ITEMS.length ? 'none' : 'block';
    grid.innerHTML = ITEMS.map(it => {
        const c = it.challenge && CHAL[it.challenge];
        const chalLine = c ? ` · ${c.e} ${esc(c.l)} (+${c.p})` : '';
        return `
        <div class="item">
            ${it.type === 'video' ? '<span class="vbadge">▶ video</span>' : ''}
            <button class="del" title="Delete" onclick="del('${it.id}')">&times;</button>
            <div class="media" onclick="window.open('${it.url}','_blank')">
                ${it.type === 'video'
                    ? `<video src="${it.url}#t=0.1" muted playsinline preload="metadata"></video>`
                    : `<img src="${it.url}" loading="lazy">`}
            </div>
            <div class="meta">
                ${it.name ? `<div class="nm">${esc(it.name)}</div>` : '<div class="nm" style="color:#bbb">Anonymous</div>'}
                ${it.caption ? `<div class="cap">${esc(it.caption)}</div>` : ''}
                <div class="cap" style="color:#8a8167">♥ ${it.likes || 0}${chalLine}</div>
                <div class="ts">${it.ts ? new Date(it.ts).toLocaleString() : ''}</div>
                <a class="dl" href="${it.url}" download target="_blank">Download ⬇</a>
            </div>
        </div>`;
    }).join('');
}

async function del(id) {
    if (!confirm('Delete this upload permanently?')) return;
    try {
        const res = await fetch(`${API_BASE}/api/admin/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Token': TOKEN },
            body: JSON.stringify({ id })
        });
        if (!res.ok) throw new Error(res.status);
        ITEMS = ITEMS.filter(x => x.id !== id);
        render();
    } catch (e) { alert('Delete failed: ' + e.message); }
}

function downloadAll() {
    // Opens a text file of every media URL so you can bulk-download (e.g. with a download manager
    // or the provided scripts/download-all.mjs in the instantmemories repo).
    const lines = ITEMS.map(it => it.url).join('\n');
    const blob = new Blob([lines], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vk-memories-urls.txt';
    a.click();
}

function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// auto-restore session
(function(){ const t = sessionStorage.getItem('vk_admin'); if (t) { TOKEN = t; load(true); } })();
</script>
</body>
</html>
